{% extends "base.html" %}
{% block content %}
<section class="swipe">
  <div class="stats" id="stats"></div>
  {% if can_search %}
  <div class="finder" id="finder">
    <input id="find-q" type="search" placeholder="🔎 Buscar un libro concreto…" autocomplete="off">
    <ul id="find-res" hidden></ul>
  </div>
  {% endif %}
  <div class="deck" id="deck">
    <div class="empty" id="empty" hidden>
      <p>🎉 No quedan libros por decidir.</p>
      <a class="btn" href="{{ url_for('lists') }}">Ver listas</a>
    </div>
  </div>
  <div class="actions">
    <button class="act undo" id="b-undo" title="Deshacer (Retroceso)" disabled>↶</button>
    <button class="act reject" id="b-reject" title="Descartar (←)">✕</button>
    <button class="act skip" id="b-skip" title="Pasar, vuelve a salir más tarde (↑)">⏭</button>
    <button class="act want" id="b-want" title="Leer (→)">♥</button>
  </div>
  <button class="readtoggle" id="b-read" aria-pressed="false"><span class="box"></span> Ya lo he leído</button>
  <p class="hint muted small">← descartar · → leer · ↑ pasar · L leído · ? Goodreads</p>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='swipe.js') }}"></script>{% endblock %}
