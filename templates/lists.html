{% extends "base.html" %}
{% block content %}
<section class="panel wide">
  <div class="tabs" id="tabs">
    <button data-k="match" class="on">💞 Nos lo quedamos</button>
    <button data-k="want">♥ Leer</button>
    <button data-k="skip">⏭ Pasados</button>
    <button data-k="reject">✕ Descartados</button>
    <button data-k="read">✓ Leídos</button>
    <button data-k="all">Todos</button>
  </div>
  <p class="muted small" id="desc"></p>
  <div class="filters">
    <input class="search" id="q" placeholder="Buscar por título o autor…">
    <span class="muted small" id="count"></span>
  </div>
  <ul class="booklist" id="list" data-me="{{ user }}" data-other="{{ other or '' }}"></ul>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='lists.js') }}"></script>{% endblock %}
