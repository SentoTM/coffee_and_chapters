{% extends "base.html" %}
{% block content %}
<form class="panel login" method="post">
  <div class="hero">
    <div class="mug" aria-hidden="true"><span class="steam"><i></i><i></i><i></i></span>☕</div>
    <h1 class="wordmark">Stars Hollow <em>Book Club</em></h1>
    <p class="tagline">Dos socios, trescientos libros.</p>
  </div>
  <label>Usuario <input name="user" autocomplete="username" required autofocus></label>
  <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Entrar</button>
</form>
{% endblock %}
